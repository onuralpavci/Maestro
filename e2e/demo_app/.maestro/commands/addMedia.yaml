appId: com.google.android.documentsui
tags:
  - passing
  - android # TODO: How do we prove this works on iOS?
---

- addMedia:
  - ../assets/image.png

# The image is inserted into MediaStore immediately, but the Files app does not
# always show the new file in time. Cold-launch documentsui and re-navigate into
# Pictures on each attempt so it rebuilds its process state and re-queries.
- retry:
    maxRetries: 3
    commands:
      - launchApp: com.google.android.documentsui # Files app
      - tapOn: Show roots
      - tapOn: Images
      - tapOn: Pictures
      - assertVisible: image.png
- longPressOn: image.png
- tapOn: Search # The picture of the bin...
- tapOn: OK
- assertNotVisible: image.png

