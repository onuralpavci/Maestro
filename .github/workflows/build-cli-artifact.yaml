name: Build CLI Artifact

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Name suffix for the uploaded artifact"
        required: false
        default: "maestro-cli"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Read CLI version
        id: version
        run: |
          VERSION=$(grep -w 'CLI_VERSION' maestro-cli/gradle.properties | cut -d'=' -f2)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build CLI distribution
        run: ./gradlew :maestro-cli:distZip --no-daemon

      - name: Upload CLI zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          path: maestro-cli/build/distributions/maestro.zip
          if-no-files-found: error
          retention-days: 14
